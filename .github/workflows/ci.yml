# Pushes and pull requests to production: unit tests, lint and a debug build, so a broken change shows up before a
# release. main is the public face of the repo (README, release notes), so edits there never start a build; neither
# do docs-only changes on production. Releases are built separately, from version tags (release.yml).
name: CI

on:
  push:
    branches: [production]
    paths-ignore:
      - "**.md"
      - ".github/release-notes/**"
  pull_request:
    branches: [production]
    paths-ignore:
      - "**.md"
      - ".github/release-notes/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports
